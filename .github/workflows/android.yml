name: Build VYRO Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract VYRO project
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "VYRO ZIP file not found"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          ROOT=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Android app
        run: |
          cd "$PROJECT_ROOT"
          gradle assembleDebug

      - name: Upload VYRO APK
        uses: actions/upload-artifact@v4
        with:
          name: VYRO-Android-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
